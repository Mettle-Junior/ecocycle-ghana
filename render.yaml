services:
  - type: web
    name: ecocycle-ghana
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecocycle-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: ecocycle-db
    databaseName: ecocycle
    user: ecocycle_user
