{% extends "base.html" %}

{% block content %}

<div class="auth-container">
    <div class="card">
        <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; text-align: center;">Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; text-align: center; margin-bottom: 1.75rem;">Sign in to your EcoCycle Ghana account</p>

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
                    <label for="password" style="margin-bottom: 0;">Password</label>
                    <a href="/forgot-password" style="font-size: 0.825rem; color: var(--primary); text-decoration: none; font-weight: 600;">Forgot Password?</a>
                </div>
                <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In</button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-secondary);">
            Don't have an account? <a href="/register" style="color: var(--primary); font-weight: 700; text-decoration: none;">Register here</a>
        </div>
    </div>
</div>

{% endblock %}
