<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users - EcoCycle Admin</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    .role-select {
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 0.9rem;
    }
    .btn-save-role {
      padding: 0.2rem 1rem;
      font-size: 0.8rem;
      margin-left: 0.3rem;
    }
  </style>
</head>
<body>
  <div id="spinner-overlay"><div class="spinner"></div></div>
  
    <nav class="navbar">
        <div class="container">
            <a href="admin-dashboard.html" class="logo">♻️ EcoCycle Admin</a>
            <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
            <div class="nav-links">
                <a href="admin-dashboard.html" class="active">Pickups</a>
                <a href="admin-rewards.html">Rewards</a>
                <a href="admin-analytics.html">Analytics</a>
                <a href="admin-users.html">Users</a>
                <a href="#" id="logoutBtn" class="btn-logout">Logout</a>
            </div>
        </div> 
    </nav>

  <div class="container" style="margin-top: 2rem;">
    <div class="card">
      <h2>👥 Manage Users</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Username</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Points</th>
              <th>Role</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="8" class="text-center">Loading users...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  
  <script type="module" src="../assets/js/nav.js"></script>
  <script type="module" src="../assets/js/admin-users.js"></script>
