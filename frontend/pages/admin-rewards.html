<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Rewards - EcoCycle Admin</title>
  <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body>
    <div id="spinner-overlay">
        <div class="spinner"></div>
    </div>
    <nav class="navbar">
        <div class="container">
            <a href="admin-dashboard.html" class="logo">♻️ EcoCycle Admin</a>
            <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
            <div class="nav-links">
                <a href="admin-dashboard.html" class="active">Pickups</a>
                <a href="admin-rewards.html">Rewards</a>
                <a href="admin-analytics.html">Analytics</a>
                <a href="admin-users.html">Users</a>
                <a href="#" id="logoutBtn" class="btn-logout">Logout</a>
            </div>
        </div> 
    </nav>

  <div class="container" style="margin-top: 2rem;">
    <div class="card">
      <h2>⚙️ Reward Rates (Points per kg)</h2>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Category</th><th>Points per kg</th><th>Action</th></tr></thead>
          <tbody id="rewardRatesTable"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h2>🎫 Manage Vouchers</h2>
      <form id="voucherForm">
        <div class="form-row">
          <div class="form-group"><label>Voucher Code</label><input name="voucher_code" required></div>
          <div class="form-group"><label>Points Required</label><input name="points_required" type="number" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Type</label>
            <select name="reward_type">
              <option value="fuel">Fuel</option>
              <option value="supermarket">Supermarket</option>
              <option value="ecg">ECG</option>
              <option value="cash">Cash</option>
            </select>
          </div>
          <div class="form-group"><label>Value (GHS)</label><input name="value_ghs" type="number" step="0.01" required></div>
        </div>
        <button type="submit" class="btn btn-primary">Add Voucher</button>
      </form>
      
      <div style="margin-top: 2rem;">
        <h3>Existing Vouchers</h3>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Code</th><th>Points Required</th><th>Type</th><th>Value (GHS)</th></tr></thead>
            <tbody id="vouchersTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

    <div class="nav-links">
        <a href="admin-dashboard.html">Pickups</a>
        <a href="admin-rewards.html">Rewards</a>
        <a href="admin-analytics.html">Analytics</a>
        <a href="#" id="logoutBtn" class="btn-logout">Logout</a>
    </div>

  <script type="module" src="../assets/js/admin-rewards.js"></script>
  <script type="module" src="../assets/js/nav.js"></script>
  <div id="toast-container" class="toast-container"></div>
</body>
</html>
