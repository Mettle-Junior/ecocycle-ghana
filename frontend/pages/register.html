<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - EcoCycle</title>
  <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body>
  <div id="spinner-overlay">
        <div class="spinner"></div>
  </div>
  <div class="container" style="max-width: 600px; margin-top: 3rem;">
    <div class="card">
      <h2>Create Account</h2>
      <form id="registerForm">
        <div class="form-row">
          <div class="form-group"><label>First Name</label><input name="first_name" required></div>
          <div class="form-group"><label>Last Name</label><input name="last_name" required></div>
        </div>
        <div class="form-group"><label>Username</label><input name="username" required></div>
        <div class="form-group"><label>Email (optional)</label><input name="email" type="email"></div>
        <div class="form-group"><label>Phone</label><input name="phone" type="tel" required></div>
        <div class="form-group"><label>Password</label><input name="password" type="password" required></div>
        <div class="form-group"><label>Location Address</label><input name="location_address" required></div>
        <!-- Hidden fields for lat/lng (can be filled via map later) -->
        <input type="hidden" name="location_lat" value="5.6037">
        <input type="hidden" name="location_lng" value="-0.1870">
        <button type="submit" class="btn btn-primary" style="width:100%;">Register</button>
      </form>
      <p class="text-center mt-2">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
  <script type="module" src="../assets/js/auth.js"></script>
  <script type="module" src="../assets/js/nav.js"></script>
  <div id="toast-container" class="toast-container"></div>
</body>
</html>
