<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - EcoCycle</title>
  <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body>
  <div id="spinner-overlay"><div class="spinner"></div></div>
  
  <div class="container" style="max-width: 500px; margin-top: 4rem;">
    <div class="card">
      <h2>🔑 Forgot Password</h2>
      <p class="text-muted">Enter your email and we'll send you a reset link.</p>
      <form id="forgotPasswordForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="resetEmail" required placeholder="your@email.com">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send Reset Link</button>
      </form>
      <p class="text-center mt-2"><a href="login.html">Back to Login</a></p>
    </div>
  </div>
  
  <div id="toast-container" class="toast-container"></div>
  
  <script type="module">
    import { showToast } from '../assets/js/toast.js';
    import { apiRequest } from '../assets/js/api.js';

    const form = document.getElementById('forgotPasswordForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('resetEmail').value;
      
      try {
        const result = await apiRequest('/password/request-reset', 'POST', { email });
        showToast('Reset link sent! Check your email.', 'success');
        // Show token for demo purposes
        if (result.resetToken) {
          showToast(`Your reset token: ${result.resetToken} (copy this)`, 'warning');
        }
      } catch (error) {
        // already handled by apiRequest
      }
    });
  </script>
</body>
</html>
