<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - EcoCycle</title>
  <link rel="stylesheet" href="../assets/css/global.css">
</head>
<body>
  <div id="spinner-overlay"><div class="spinner"></div></div>
  
  <div class="container" style="max-width: 500px; margin-top: 4rem;">
    <div class="card">
      <h2>🔐 Reset Password</h2>
      <form id="resetPasswordForm">
        <div class="form-group">
          <label>Reset Token</label>
          <input type="text" id="resetToken" required placeholder="Enter token from email">
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" id="newPassword" required minlength="6">
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="confirmPassword" required>
        </div>
        <button type="submit" class="btn btn-success" style="width:100%;">Reset Password</button>
      </form>
      <p class="text-center mt-2"><a href="login.html">Back to Login</a></p>
    </div>
  </div>
  
  <div id="toast-container" class="toast-container"></div>
  
  <script type="module">
    import { showToast } from '../assets/js/toast.js';
    import { apiRequest } from '../assets/js/api.js';

    const form = document.getElementById('resetPasswordForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = document.getElementById('resetToken').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (newPassword !== confirmPassword) {
        showToast('Passwords do not match!', 'error');
        return;
      }
      if (newPassword.length < 6) {
        showToast('Password must be at least 6 characters.', 'error');
        return;
      }
      
      try {
        await apiRequest('/password/reset-password', 'POST', { token, new_password: newPassword });
        showToast('Password reset successful! Please login.', 'success');
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } catch (error) {
        // already handled
      }
    });
  </script>
</body>
</html>
